<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Battleships</title>
<style>
  :root {
    --bg: #0b1a2b;
    --panel: #12283f;
    --grid: #1b3a5c;
    --line: #2c5580;
    --miss: #6b8bab;
    --hit: #e2603c;
    --sunk: #8b2f1a;
    --ship: #3f6f56;
    --text: #e7f0f8;
    --muted: #9db6cd;
    --accent: #4fb3d9;
    --cell: clamp(22px, 7.2vw, 32px);
  }
  @media (min-width: 780px) { :root { --cell: 30px; } }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  header { text-align: center; padding: 18px 12px 4px; }
  h1 { margin: 0; font-size: clamp(20px, 5vw, 28px); letter-spacing: 2px; }
  #status {
    text-align: center; min-height: 24px; font-size: 16px; margin: 10px auto;
    color: var(--accent); max-width: 640px; padding: 0 12px;
  }
  #settings {
    display: flex; flex-wrap: wrap; gap: 14px; justify-content: center;
    align-items: center; font-size: 13px; color: var(--muted); padding: 0 12px;
  }
  #settings label { display: flex; align-items: center; gap: 6px; }
  select {
    background: var(--panel); color: var(--text); border: 1px solid var(--line);
    border-radius: 5px; padding: 4px 6px; font-size: 13px;
  }
  #boards { display: flex; flex-wrap: wrap; gap: 22px; justify-content: center; padding: 8px 12px 20px; }
  .board-wrap { background: var(--panel); border-radius: 10px; padding: 12px; }
  .board-wrap h2 { margin: 0 0 4px; font-size: 14px; text-transform: uppercase; letter-spacing: 1px; text-align: center; font-weight: 600; }
  .stats { text-align: center; font-size: 11px; color: var(--muted); margin-bottom: 8px; min-height: 14px; }
  .grid {
    display: grid;
    grid-template-columns: calc(var(--cell) * 0.7) repeat(10, var(--cell));
    grid-auto-rows: var(--cell);
    gap: 2px;
    touch-action: manipulation;
  }
  .label { display: flex; align-items: center; justify-content: center; font-size: 11px; color: var(--muted); }
  .cell {
    background: var(--grid);
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 0;
    color: inherit;
    font: inherit;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; line-height: 1;
    cursor: default;
    transition: background .12s;
  }
  .cell:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .cell.ship { background: var(--ship); }
  .cell.miss { background: var(--miss); }
  .cell.hit { background: var(--hit); }
  .cell.sunk { background: var(--sunk); }
  #enemy .cell.open { cursor: crosshair; }
  #enemy .cell.open:hover { background: #2a5480; }
  .cell.preview { background: #4a7f63; }
  .cell.invalid { background: #7a3030; }
  #controls { text-align: center; padding-bottom: 26px; display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  button {
    background: var(--accent); color: #06222f; border: 0; border-radius: 6px;
    padding: 9px 16px; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  button:hover:enabled { filter: brightness(1.1); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  #fleets { display: flex; gap: 24px; justify-content: center; flex-wrap: wrap; margin: 8px 0 12px; font-size: 12px; }
  .fleet-col { text-align: center; }
  .fleet-col h3 { margin: 0 0 5px; font-size: 11px; letter-spacing: 1px; color: var(--muted); text-transform: uppercase; font-weight: 600; }
  .fleet-row { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
  .fleet-item { background: var(--panel); padding: 4px 8px; border-radius: 6px; }
  .fleet-item.done { opacity: .4; text-decoration: line-through; }
  .fleet-item.active { outline: 2px solid var(--accent); }
</style>
</head>
<body>
<header>
  <h1>BATTLESHIPS</h1>
  <div id="settings">
    <label>Difficulty
      <select id="difficulty">
        <option value="easy">Easy - random fire</option>
        <option value="normal" selected>Normal - hunt &amp; target</option>
        <option value="hard">Hard - probability density</option>
      </select>
    </label>
    <label><input type="checkbox" id="salvo"> Salvo mode (shots = ships afloat)</label>
    <label><input type="checkbox" id="sound" checked> Sound</label>
  </div>
  <div id="fleets"></div>
  <div id="status" role="status" aria-live="polite"></div>
</header>

<div id="boards">
  <div class="board-wrap">
    <h2>Your waters</h2>
    <div class="stats" id="player-stats"></div>
    <div class="grid" id="player" role="grid" aria-label="Your waters"></div>
  </div>
  <div class="board-wrap">
    <h2>Enemy waters</h2>
    <div class="stats" id="enemy-stats"></div>
    <div class="grid" id="enemy" role="grid" aria-label="Enemy waters"></div>
  </div>
</div>

<div id="controls">
  <button id="rotate">Rotate (R)</button>
  <button id="random">Random placement</button>
  <button id="reset">New game</button>
</div>

<script>
const SIZE = 10;
const SHIPS = [
  { name: "Carrier", len: 5 },
  { name: "Battleship", len: 4 },
  { name: "Cruiser", len: 3 },
  { name: "Submarine", len: 3 },
  { name: "Destroyer", len: 2 },
];
const AI_DELAY = 550;
const SALVO_SHOT_DELAY = 450;

const el = {
  player: document.getElementById("player"),
  enemy: document.getElementById("enemy"),
  status: document.getElementById("status"),
  fleets: document.getElementById("fleets"),
  playerStats: document.getElementById("player-stats"),
  enemyStats: document.getElementById("enemy-stats"),
  difficulty: document.getElementById("difficulty"),
  salvo: document.getElementById("salvo"),
  sound: document.getElementById("sound"),
  rotate: document.getElementById("rotate"),
  random: document.getElementById("random"),
  reset: document.getElementById("reset"),
};

let state;
let timers = [];
let hover = null;
const focusCell = { player: { row: 0, col: 0 }, enemy: { row: 0, col: 0 } };

function later(fn, ms) {
  const id = setTimeout(() => {
    timers = timers.filter(t => t !== id);
    fn();
  }, ms);
  timers.push(id);
  return id;
}

function clearTimers() {
  timers.forEach(clearTimeout);
  timers = [];
}

function emptyBoard() {
  return {
    ships: [],
    shots: Array.from({ length: SIZE }, () => Array(SIZE).fill(null)), // null | "miss" | "hit"
    fired: 0,
    hits: 0,
  };
}

function newState() {
  return {
    phase: "placing", // placing | playing | over
    busy: false,
    horizontal: true,
    placeIndex: 0,
    salvoLeft: 1,
    player: emptyBoard(),
    enemy: emptyBoard(),
    aiQueue: [],
  };
}

function shipCells(row, col, len, horizontal) {
  const cells = [];
  for (let i = 0; i < len; i++) {
    cells.push(horizontal ? { row, col: col + i } : { row: row + i, col });
  }
  return cells;
}

function inBounds(row, col) {
  return row >= 0 && col >= 0 && row < SIZE && col < SIZE;
}

function canPlace(board, cells) {
  return cells.every(({ row, col }) =>
    inBounds(row, col) && !board.ships.some(s => s.cells.some(c => c.row === row && c.col === col)));
}

function placeShip(board, name, cells) {
  board.ships.push({ name, cells, hits: new Set() });
}

function randomFleet(board) {
  board.ships = [];
  for (const { name, len } of SHIPS) {
    for (;;) {
      const horizontal = Math.random() < 0.5;
      const row = Math.floor(Math.random() * SIZE);
      const col = Math.floor(Math.random() * SIZE);
      const cells = shipCells(row, col, len, horizontal);
      if (canPlace(board, cells)) { placeShip(board, name, cells); break; }
    }
  }
}

function shipAt(board, row, col) {
  return board.ships.find(s => s.cells.some(c => c.row === row && c.col === col));
}

function isSunk(ship) {
  return ship.hits.size === ship.cells.length;
}

function afloat(board) {
  return board.ships.filter(s => !isSunk(s)).length;
}

function allSunk(board) {
  return board.ships.length > 0 && board.ships.every(isSunk);
}

/* ---------- AI ---------- */

// Hit cells that don't yet belong to a ship the attacker knows is sunk.
function unresolvedHits(board) {
  const cells = [];
  for (let r = 0; r < SIZE; r++) {
    for (let c = 0; c < SIZE; c++) {
      if (board.shots[r][c] !== "hit") continue;
      const ship = shipAt(board, r, c);
      if (!isSunk(ship)) cells.push({ row: r, col: c });
    }
  }
  return cells;
}

function remainingLengths(board) {
  return board.ships.filter(s => !isSunk(s)).map(s => s.cells.length);
}

function openCells(board) {
  const cells = [];
  for (let r = 0; r < SIZE; r++)
    for (let c = 0; c < SIZE; c++)
      if (!board.shots[r][c]) cells.push({ row: r, col: c });
  return cells;
}

function pick(list) {
  return list[Math.floor(Math.random() * list.length)];
}

// Split unresolved hits into orthogonally connected clusters, so hits on two
// different ships are never extended as if they were one run.
function hitClusters(board) {
  const hits = unresolvedHits(board);
  const key = h => `${h.row},${h.col}`;
  const pending = new Map(hits.map(h => [key(h), h]));
  const clusters = [];
  while (pending.size) {
    const [firstKey, first] = pending.entries().next().value;
    pending.delete(firstKey);
    const cluster = [first];
    const queue = [first];
    while (queue.length) {
      const { row, col } = queue.pop();
      for (const n of [{ row: row - 1, col }, { row: row + 1, col }, { row, col: col - 1 }, { row, col: col + 1 }]) {
        const found = pending.get(key(n));
        if (!found) continue;
        pending.delete(key(n));
        cluster.push(found);
        queue.push(found);
      }
    }
    clusters.push(cluster);
  }
  return clusters;
}

// Hunt & target: after a hit, extend along the run of hits if one is established,
// otherwise probe the four neighbours.
function clusterTargets(board, hits) {
  const open = cells => cells.filter(c => inBounds(c.row, c.col) && !board.shots[c.row][c.col]);
  const sameRow = hits.every(h => h.row === hits[0].row);
  const sameCol = hits.every(h => h.col === hits[0].col);
  if (hits.length > 1 && (sameRow || sameCol)) {
    const ends = sameRow
      ? [{ row: hits[0].row, col: Math.min(...hits.map(h => h.col)) - 1 },
         { row: hits[0].row, col: Math.max(...hits.map(h => h.col)) + 1 }]
      : [{ row: Math.min(...hits.map(h => h.row)) - 1, col: hits[0].col },
         { row: Math.max(...hits.map(h => h.row)) + 1, col: hits[0].col }];
    const extensions = open(ends);
    // Both ends closed means the run spans two touching ships: fall back to
    // probing the sides rather than giving up on these hits.
    if (extensions.length) return extensions;
  }
  return open(hits.flatMap(({ row, col }) =>
    [{ row: row - 1, col }, { row: row + 1, col }, { row, col: col - 1 }, { row, col: col + 1 }]));
}

function computeTargets(board) {
  for (const cluster of hitClusters(board)) {
    const targets = clusterTargets(board, cluster);
    if (targets.length) return targets;
  }
  return [];
}

// Count, for every unfired cell, how many legal placements of the remaining
// ships cover it; placements covering a known unresolved hit dominate, which
// makes targeting fall out of the same calculation as hunting.
function densityTarget(board) {
  const lengths = remainingLengths(board);
  const hits = unresolvedHits(board);
  const isHit = (r, c) => hits.some(h => h.row === r && h.col === c);
  const blocked = (r, c) => {
    const shot = board.shots[r][c];
    if (shot === "miss") return true;
    if (shot === "hit" && !isHit(r, c)) return true; // part of an already sunk ship
    return false;
  };

  const density = Array.from({ length: SIZE }, () => Array(SIZE).fill(0));
  for (const len of lengths) {
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        for (const horizontal of [true, false]) {
          const cells = shipCells(r, c, len, horizontal);
          if (!cells.every(x => inBounds(x.row, x.col) && !blocked(x.row, x.col))) continue;
          const covered = cells.filter(x => isHit(x.row, x.col)).length;
          const weight = covered ? Math.pow(50, covered) : 1;
          for (const x of cells) {
            if (!board.shots[x.row][x.col]) density[x.row][x.col] += weight;
          }
        }
      }
    }
  }

  let best = [];
  let bestScore = 0;
  for (let r = 0; r < SIZE; r++) {
    for (let c = 0; c < SIZE; c++) {
      const score = density[r][c];
      if (score > bestScore) { bestScore = score; best = [{ row: r, col: c }]; }
      else if (score === bestScore && score > 0) best.push({ row: r, col: c });
    }
  }
  return best.length ? pick(best) : null;
}

function aiPickTarget() {
  const board = state.player;
  const difficulty = el.difficulty.value;
  if (difficulty === "hard") {
    const target = densityTarget(board);
    if (target) return target;
  }
  if (difficulty === "normal") {
    const targets = computeTargets(board);
    if (targets.length) return pick(targets);
    // Parity search: the shortest surviving ship must cross one of these cells.
    const step = Math.min(...remainingLengths(board), SIZE);
    const parity = openCells(board).filter(({ row, col }) => (row + col) % step === 0);
    if (parity.length) return pick(parity);
  }
  const open = openCells(board);
  return open.length ? pick(open) : null;
}

/* ---------- rendering ---------- */

function buildGrid(container, side) {
  container.innerHTML = "";
  const corner = document.createElement("div");
  corner.className = "label";
  container.appendChild(corner);
  for (let c = 0; c < SIZE; c++) {
    const d = document.createElement("div");
    d.className = "label";
    d.textContent = String.fromCharCode(65 + c);
    container.appendChild(d);
  }
  for (let r = 0; r < SIZE; r++) {
    const rl = document.createElement("div");
    rl.className = "label";
    rl.textContent = r + 1;
    container.appendChild(rl);
    for (let c = 0; c < SIZE; c++) {
      const cell = document.createElement("button");
      cell.type = "button";
      cell.className = "cell";
      cell.dataset.row = r;
      cell.dataset.col = c;
      cell.dataset.side = side;
      cell.tabIndex = r === 0 && c === 0 ? 0 : -1;
      container.appendChild(cell);
    }
  }
}

function cellEl(side, row, col) {
  const container = side === "player" ? el.player : el.enemy;
  return container.querySelector(`.cell[data-row="${row}"][data-col="${col}"]`);
}

function cellName(row, col) {
  return `${String.fromCharCode(65 + col)}${row + 1}`;
}

function render() {
  for (const side of ["player", "enemy"]) {
    const board = state[side];
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        const cell = cellEl(side, r, c);
        cell.className = "cell";
        cell.textContent = "";
        const ship = shipAt(board, r, c);
        const reveal = side === "player" || (ship && isSunk(ship)) || state.phase === "over";
        if (ship && reveal) cell.classList.add(isSunk(ship) ? "sunk" : "ship");
        const shot = board.shots[r][c];
        if (shot === "miss") { cell.classList.add("miss"); cell.textContent = "\u00b7"; }
        if (shot === "hit") { cell.classList.add(isSunk(ship) ? "sunk" : "hit"); cell.textContent = "\u2715"; }
        if (side === "enemy" && state.phase === "playing" && !state.busy && !shot) cell.classList.add("open");

        let label = cellName(r, c);
        if (shot === "hit") label += ship && isSunk(ship) ? ", sunk" : ", hit";
        else if (shot === "miss") label += ", miss";
        else if (ship && reveal) label += side === "player" ? `, your ${ship.name}` : `, enemy ${ship.name}`;
        cell.setAttribute("aria-label", label);
      }
    }
  }
  if (hover && state.phase === "placing") showPreview(hover.row, hover.col);
  renderFleets();
  renderStats();
}

function renderStats() {
  const line = board => {
    if (!board.fired) return "no shots fired";
    return `${board.fired} shots \u00b7 ${board.hits} hits (${Math.round((board.hits / board.fired) * 100)}%)`;
  };
  // Shots recorded on a board were fired at it by the other side.
  el.playerStats.textContent = `Enemy: ${line(state.player)}`;
  el.enemyStats.textContent = `You: ${line(state.enemy)}`;
}

function renderFleets() {
  el.fleets.innerHTML = "";
  const col = (title, render) => {
    const wrap = document.createElement("div");
    wrap.className = "fleet-col";
    const h = document.createElement("h3");
    h.textContent = title;
    wrap.appendChild(h);
    const row = document.createElement("div");
    row.className = "fleet-row";
    SHIPS.forEach((spec, i) => {
      const d = document.createElement("div");
      d.className = `fleet-item ${render(spec, i)}`.trim();
      d.textContent = `${spec.name} (${spec.len})`;
      row.appendChild(d);
    });
    wrap.appendChild(row);
    el.fleets.appendChild(wrap);
  };

  if (state.phase === "placing") {
    col("To place", (spec, i) => i < state.placeIndex ? "done" : i === state.placeIndex ? "active" : "");
    return;
  }
  const sunkIn = board => spec => {
    const ship = board.ships.find(s => s.name === spec.name);
    return ship && isSunk(ship) ? "done" : "";
  };
  col("Enemy fleet", sunkIn(state.enemy));
  col("Your fleet", sunkIn(state.player));
}

function clearPreview() {
  el.player.querySelectorAll(".preview, .invalid").forEach(c => c.classList.remove("preview", "invalid"));
}

function showPreview(row, col) {
  clearPreview();
  const spec = SHIPS[state.placeIndex];
  if (!spec) return;
  const cells = shipCells(row, col, spec.len, state.horizontal);
  const ok = canPlace(state.player, cells);
  for (const { row: r, col: c } of cells) {
    const cell = cellEl("player", r, c);
    if (cell) cell.classList.add(ok ? "preview" : "invalid");
  }
}

function setStatus(msg) { el.status.textContent = msg; }

/* ---------- sound ---------- */

let audio = null;
function beep(freq, duration, type) {
  if (!el.sound.checked) return;
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    const osc = audio.createOscillator();
    const gain = audio.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.06, audio.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + duration);
    osc.connect(gain).connect(audio.destination);
    osc.start();
    osc.stop(audio.currentTime + duration);
  } catch (e) { /* audio unavailable */ }
}

const sfx = {
  miss: () => beep(220, 0.12, "sine"),
  hit: () => beep(140, 0.28, "square"),
  sunk: () => beep(90, 0.5, "sawtooth"),
};

/* ---------- placement ---------- */

function onPlayerClick(row, col) {
  if (state.phase !== "placing") return;
  const spec = SHIPS[state.placeIndex];
  const cells = shipCells(row, col, spec.len, state.horizontal);
  if (!canPlace(state.player, cells)) {
    setStatus("That ship doesn't fit there.");
    return;
  }
  placeShip(state.player, spec.name, cells);
  state.placeIndex++;
  if (state.placeIndex >= SHIPS.length) startGame();
  else setStatus(`Place your ${SHIPS[state.placeIndex].name} (${SHIPS[state.placeIndex].len}).`);
  render();
}

function startGame() {
  randomFleet(state.enemy);
  state.phase = "playing";
  state.salvoLeft = salvoSize(state.player);
  el.salvo.disabled = true;
  setStatus(state.salvoLeft > 1
    ? `Fleet ready. Fire your salvo of ${state.salvoLeft} shots!`
    : "Fleet ready. Fire at enemy waters!");
}

function salvoSize(board) {
  return el.salvo.checked ? Math.max(afloat(board), 1) : 1;
}

/* ---------- firing ---------- */

function fire(board, row, col) {
  const ship = shipAt(board, row, col);
  board.fired++;
  if (ship) {
    board.shots[row][col] = "hit";
    board.hits++;
    ship.hits.add(`${row},${col}`);
    if (isSunk(ship)) sfx.sunk(); else sfx.hit();
    return ship;
  }
  board.shots[row][col] = "miss";
  sfx.miss();
  return null;
}

function onEnemyClick(row, col) {
  if (state.phase !== "playing" || state.busy) return;
  if (state.enemy.shots[row][col]) return;

  const ship = fire(state.enemy, row, col);
  if (ship) setStatus(isSunk(ship) ? `Hit! You sank the enemy ${ship.name}.` : "Hit!");
  else setStatus("Miss.");

  if (allSunk(state.enemy)) { finish("You win! Enemy fleet destroyed."); return; }

  state.salvoLeft--;
  if (state.salvoLeft > 0) {
    setStatus(`${el.status.textContent} ${state.salvoLeft} shot${state.salvoLeft > 1 ? "s" : ""} left in your salvo.`);
    render();
    return;
  }

  state.busy = true;
  render();
  later(() => aiTurn(salvoSize(state.enemy)), AI_DELAY);
}

function aiTurn(shotsLeft) {
  if (state.phase !== "playing") return;
  const board = state.player;
  const target = aiPickTarget();
  if (!target) { endAiTurn(); return; }

  const ship = fire(board, target.row, target.col);
  if (ship) setStatus(isSunk(ship) ? `Enemy sank your ${ship.name}!` : `Enemy hit your fleet at ${cellName(target.row, target.col)}.`);
  else setStatus(`Enemy missed at ${cellName(target.row, target.col)}.`);
  render();

  if (allSunk(board)) { finish("You lose. Your fleet has been sunk."); return; }
  if (shotsLeft > 1) later(() => aiTurn(shotsLeft - 1), SALVO_SHOT_DELAY);
  else endAiTurn();
}

function endAiTurn() {
  state.busy = false;
  state.salvoLeft = salvoSize(state.player);
  if (state.salvoLeft > 1) setStatus(`${el.status.textContent} Your salvo: ${state.salvoLeft} shots.`);
  render();
}

function finish(msg) {
  clearTimers();
  state.phase = "over";
  state.busy = false;
  setStatus(msg);
  render();
}

function reset() {
  clearTimers();
  state = newState();
  hover = null;
  focusCell.player = { row: 0, col: 0 };
  focusCell.enemy = { row: 0, col: 0 };
  el.salvo.disabled = false;
  buildGrid(el.player, "player");
  buildGrid(el.enemy, "enemy");
  setStatus("Place your fleet: click a cell to drop a ship. Press R or right-click to rotate.");
  render();
}

/* ---------- input ---------- */

function toggleRotate() {
  if (state.phase !== "placing") return;
  state.horizontal = !state.horizontal;
  setStatus(`Orientation: ${state.horizontal ? "horizontal" : "vertical"}.`);
  if (hover) showPreview(hover.row, hover.col);
}

function moveFocus(side, dRow, dCol) {
  const pos = focusCell[side];
  pos.row = Math.min(SIZE - 1, Math.max(0, pos.row + dRow));
  pos.col = Math.min(SIZE - 1, Math.max(0, pos.col + dCol));
  const container = side === "player" ? el.player : el.enemy;
  container.querySelectorAll(".cell").forEach(c => { c.tabIndex = -1; });
  const cell = cellEl(side, pos.row, pos.col);
  cell.tabIndex = 0;
  cell.focus();
  if (side === "player" && state.phase === "placing") {
    hover = { row: pos.row, col: pos.col };
    showPreview(pos.row, pos.col);
  }
}

const ARROWS = {
  ArrowUp: [-1, 0], ArrowDown: [1, 0], ArrowLeft: [0, -1], ArrowRight: [0, 1],
};

for (const side of ["player", "enemy"]) {
  const container = el[side];
  container.addEventListener("click", e => {
    const cell = e.target.closest(".cell");
    if (!cell) return;
    const row = +cell.dataset.row, col = +cell.dataset.col;
    focusCell[side] = { row, col };
    if (side === "player") onPlayerClick(row, col); else onEnemyClick(row, col);
  });
  container.addEventListener("keydown", e => {
    const move = ARROWS[e.key];
    if (!move) return;
    e.preventDefault();
    moveFocus(side, move[0], move[1]);
  });
}

el.player.addEventListener("mouseover", e => {
  const cell = e.target.closest(".cell");
  if (!cell || state.phase !== "placing") return;
  hover = { row: +cell.dataset.row, col: +cell.dataset.col };
  showPreview(hover.row, hover.col);
});
el.player.addEventListener("mouseleave", () => { hover = null; clearPreview(); });
el.player.addEventListener("contextmenu", e => { e.preventDefault(); toggleRotate(); });

document.addEventListener("keydown", e => {
  if (e.key.toLowerCase() === "r") toggleRotate();
});
el.rotate.addEventListener("click", toggleRotate);
el.random.addEventListener("click", () => {
  if (state.phase !== "placing") return;
  randomFleet(state.player);
  state.placeIndex = SHIPS.length;
  startGame();
  render();
});
el.reset.addEventListener("click", reset);
el.salvo.addEventListener("change", () => {
  if (state.phase === "placing") {
    setStatus(el.salvo.checked
      ? "Salvo mode on: each turn you fire one shot per ship still afloat."
      : "Salvo mode off: one shot per turn.");
  }
});

reset();
</script>
</body>
</html>
